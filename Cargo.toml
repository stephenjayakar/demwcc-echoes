[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
mwdec-core = { path = "crates/mwdec-core" }
mwdec-obj = { path = "crates/mwdec-obj" }
mwdec-project = { path = "crates/mwdec-project" }
mwdec-mwcc = { path = "crates/mwdec-mwcc" }
mwdec-ctx = { path = "crates/mwdec-ctx" }
mwdec-lift = { path = "crates/mwdec-lift" }
mwdec-emit = { path = "crates/mwdec-emit" }
mwdec-search = { path = "crates/mwdec-search" }
mwdec-inline = { path = "crates/mwdec-inline" }
anyhow = "1"
object = { version = "0.36", default-features = false, features = ["read", "elf", "std"] }
ppc750cl = "0.3.3"
cwdemangle = "1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
debug = 1
